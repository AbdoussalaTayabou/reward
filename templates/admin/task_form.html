{% extends "admin/_layout.html" %}
{% block admin_title %}Tâche{% endblock %}
{% block admin_content %}
<h1 class="text-2xl font-bold mb-4">{{ "Éditer" if task else "Nouvelle" }} tâche</h1>
<form method="post" class="space-y-4 bg-white border rounded p-4">
  <div>
    <label class="block text-sm font-medium">Titre</label>
    <input name="title" value="{{ task.title if task else '' }}" required class="border rounded w-full px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium">Description</label>
    <textarea name="description" rows="5" required class="border rounded w-full px-3 py-2">{{ task.description if task else '' }}</textarea>
  </div>
  <div>
    <label class="block text-sm font-medium">URL d'action (optionnel)</label>
    <input name="action_url" value="{{ task.action_url if task else '' }}" class="border rounded w-full px-3 py-2">
  </div>
  <div class="flex gap-4">
    <div>
      <label class="block text-sm font-medium">Points</label>
      <input type="number" name="points_reward" value="{{ task.points_reward if task else 30 }}" min="1" class="border rounded px-3 py-2 w-32">
    </div>
    <label class="flex items-center gap-2 mt-6 text-sm">
      <input type="checkbox" name="active" {% if not task or task.active %}checked{% endif %}> Actif
    </label>
  </div>
  <div class="pt-2">
    <button class="bg-indigo-600 text-white px-4 py-2 rounded">Enregistrer</button>
    <a href="{{ url_for('admin.tasks_list') }}" class="ml-2 text-sm">Annuler</a>
  </div>
</form>
{% endblock %}
